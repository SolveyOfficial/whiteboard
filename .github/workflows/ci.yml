name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_COLOR: 2

jobs:
  check:
    name: Lint, type check and tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn test:code && yarn test:other

      - name: Type check
        run: yarn test:typecheck

      - name: Unit tests
        run: yarn test:app --watch=false

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # solvey.in/tools/<repository>/ is forwarded to the tools/<repository>/
      # folder of this site, so the same commit is also built for that path.
      # Both builds write to the same folder, so this one goes first and is
      # set aside
      - name: Build the copy for solvey.in/tools
        run: |
          yarn build
          mv excalidraw-app/build "$RUNNER_TEMP/tools-copy"
        env:
          BASE_PATH: /tools/${{ github.event.repository.name }}/

      - name: Build
        run: yarn build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Add the copy for solvey.in/tools
        run: |
          mkdir -p excalidraw-app/build/tools
          mv "$RUNNER_TEMP/tools-copy" "excalidraw-app/build/tools/${{ github.event.repository.name }}"

      - name: Check licence notices are up to date
        run: yarn notices && git diff --exit-code THIRD_PARTY_NOTICES.md

      # Publishes to GitHub Pages once the repository is public
      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./excalidraw-app/build/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [check, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
